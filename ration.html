<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2b170f"><title>Recipes & Ration · Apna Sajhedari</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--brown:#2b170f;--gold:#d9b36c;--bg:#030504;--ink:#f4f6f4;--line:#70591b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#123a27 0,#030504 55%);color:var(--ink);font:15px/1.5 system-ui}header{background:linear-gradient(120deg,#2b170f,#65432e);color:#f5d889;padding:15px max(16px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--gold)}header a{color:#f5d889}main{max-width:1050px;margin:auto;padding:22px 15px}.panel{background:linear-gradient(145deg,#111a13,#050706 75%);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:grid;gap:6px;margin:10px 0}label{font-size:12px;font-weight:800;color:#d9c58b}input,textarea,select{width:100%;padding:11px;border:1px solid #d8c5b2;border-radius:10px;font:inherit;background:#080b09;color:#f4f6f4;border-color:#51431d}.btn{border:0;border-radius:10px;padding:10px 14px;background:#111a13;color:#f5d16a;border:1px solid #d9b36c;font-weight:750;cursor:pointer}.btn.alt{background:#080b09;color:#d9b36c;border:1px solid #70591b}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tab{background:#080b09;color:#d9b36c;border:1px solid #70591b}.tab.active{background:#111a13;color:#f5d16a;border:1px solid #d9b36c}.hidden{display:none!important}.muted{color:#aab8ae;font-size:13px}.entry{border:1px solid var(--line);padding:12px;border-radius:12px;margin:9px 0;background:#fff}.status{padding:10px;background:#111a13;border:1px solid #70591b;color:#f5d16a;border-radius:10px;margin-bottom:12px}@media(max-width:600px){header{padding:12px}main{padding:12px}}
</style></head><body><header><div><strong>🍲 Recipes · Ration Store · Purchase</strong><div class="muted" style="color:#f2dfc9">Apna Sajhedari — Admin workspace</div></div><a href="./index.html">← Food Dashboard</a></header><main><div id="msg" class="status">Checking login…</div>
<section id="login" class="panel hidden"><h2>Admin login</h2><p class="muted">Food app ka existing Supabase login use karein.</p><div class="grid"><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div></div><button class="btn" id="loginBtn">Login</button></section>
<section id="workspace" class="hidden"><div class="tabs"><button class="btn tab active" data-tab="recipes">Recipes</button><button class="btn tab" data-tab="stock">Ration Store</button><button class="btn tab" data-tab="purchase">Purchase</button></div>
<section id="recipes" class="panel"><h2>Recipe book</h2><div id="recipeForm"><div class="grid"><div class="field"><label>Recipe name</label><input id="rTitle"></div><div class="field"><label>Category</label><input id="rCategory" placeholder="Breakfast, lunch…"></div><div class="field"><label>Price (₹)</label><input id="rPrice" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Recipe photo URL</label><input id="rImage" type="url" placeholder="https://…"></div></div><div class="field"><label>Ingredients</label><textarea id="rIngredients" rows="3"></textarea></div><div class="field"><label>Cooking instructions</label><textarea id="rInstructions" rows="5"></textarea></div><button class="btn" id="saveRecipe">Save recipe</button></div><div id="recipeList"></div></section>
<section id="stock" class="panel hidden"><h2>Ration Store · Stock</h2><div id="stockForm"><div class="grid"><div class="field"><label>Item</label><input id="iName"></div><div class="field"><label>Unit (kg, litre, packet)</label><input id="iUnit" value="kg"></div><div class="field"><label>Opening quantity</label><input id="iQty" type="number" min="0" step=".001" value="0"></div><div class="field"><label>Reorder alert level</label><input id="iReorder" type="number" min="0" step=".001" value="0"></div></div><button class="btn" id="saveItem">Add stock item</button></div><div id="stockList"></div></section>
<section id="purchase" class="panel hidden"><h2>Purchase entry</h2><div id="purchaseForm"><div class="grid"><div class="field"><label>Ration item</label><select id="pItem"></select></div><div class="field"><label>Date</label><input id="pDate" type="date"></div><div class="field"><label>Quantity</label><input id="pQty" type="number" min=".001" step=".001"></div><div class="field"><label>Unit price</label><input id="pPrice" type="number" min="0" step=".01"></div><div class="field"><label>Supplier</label><input id="pSupplier"></div></div><div class="field"><label>Notes / bill reference</label><textarea id="pNotes"></textarea></div><button class="btn" id="savePurchase">Save purchase</button></div><div id="purchaseList"></div></section></section></main>
<script>
const db=window.supabase.createClient('https://atnlyzitqolbtmsjnzlt.supabase.co','sb_publishable_U7wR3oHtnTJ2SRi5v9VwoA__qDv4-fu');const $=id=>document.getElementById(id);let user=null,items=[];
function msg(t){$('msg').textContent=t}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function init(){const {data:{session}}=await db.auth.getSession();if(!session){$('login').classList.remove('hidden');msg('Please sign in.');return}user=session.user;const {data,error}=await db.from('food_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){msg('Admin access required. Ration and purchase records are restricted.');return}$('workspace').classList.remove('hidden');msg('Admin connected · cloud sync active');await Promise.all([loadRecipes(),loadStock(),loadPurchases()])}
$('loginBtn').onclick=async()=>{const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return msg(error.message);user=data.user;await init()};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['recipes','stock','purchase'].forEach(id=>$(id).classList.toggle('hidden',id!==b.dataset.tab))});
async function loadRecipes(){const {data,error}=await db.from('food_recipes').select('*').order('title');if(error)return msg('Recipes table ready karne ke liye migration SQL run karein: '+error.message);$('recipeList').innerHTML=(data||[]).map(x=>'<article class="entry">'+(x.image_url?'<img src="'+esc(x.image_url)+'" alt="" style="max-width:180px;max-height:120px;object-fit:cover;border-radius:8px">':'')+'<b>'+esc(x.title)+'</b> · '+esc(x.category)+' · ₹'+Number(x.price||0).toFixed(2)+'<p><b>Ingredients:</b><br>'+esc(x.ingredients).replace(/\n/g,'<br>')+'</p><p><b>Method:</b><br>'+esc(x.instructions).replace(/\n/g,'<br>')+'</p><p><b>Cart visibility:</b> '+(x.available?'Shown in member cart':'Hidden from member cart')+'</p><button class="btn" onclick="toggleRecipeCart(\''+x.id+'\','+(x.available?'false':'true')+')">'+(x.available?'Hide from Cart':'Show in Cart')+'</button></article>').join('')||'<p class="muted">Abhi recipes add nahi hui.</p>'}
window.toggleRecipeCart=async(id,visible)=>{const {error}=await db.from('food_recipes').update({available:visible,updated_at:new Date().toISOString()}).eq('id',id);if(error)return msg('Cart visibility update nahi hui: '+error.message);msg(visible?'Recipe member cart mein show hogi':'Recipe member cart se hide hui');await loadRecipes()};
async function loadStock(){const {data,error}=await db.from('ration_items').select('*').order('name');if(error)return msg('Ration tables ke liye migration SQL run karein: '+error.message);items=data||[];$('stockList').innerHTML=items.map(x=>'<article class="entry"><b>'+esc(x.name)+'</b> — '+Number(x.quantity).toLocaleString()+' '+esc(x.unit)+(Number(x.quantity)<=Number(x.reorder_level)?' <b>⚠ Low stock</b>':'')+'</article>').join('')||'<p class="muted">Stock items abhi add nahi hain.</p>';$('pItem').innerHTML=items.map(x=>'<option value="'+x.id+'">'+esc(x.name)+' ('+esc(x.unit)+')</option>').join('')}
async function loadPurchases(){const {data,error}=await db.from('ration_purchases').select('*,ration_items(name,unit)').order('purchase_date',{ascending:false}).limit(100);if(error)return msg('Purchase table ke liye migration SQL run karein: '+error.message);$('purchaseList').innerHTML=(data||[]).map(x=>'<article class="entry"><b>'+esc(x.ration_items?.name||'Item')+'</b> · '+esc(x.purchase_date)+'<br>'+Number(x.quantity)+' '+esc(x.ration_items?.unit||'')+' × ₹'+Number(x.unit_price).toFixed(2)+' = <b>₹'+(Number(x.quantity)*Number(x.unit_price)).toFixed(2)+'</b><div class="muted">'+esc(x.supplier)+' '+esc(x.notes)+'</div></article>').join('')||'<p class="muted">Purchase entries abhi nahi hain.</p>'}
$('saveRecipe').onclick=async()=>{if(!$('rTitle').value.trim())return msg('Recipe name required');const {error}=await db.from('food_recipes').insert({title:$('rTitle').value.trim(),category:$('rCategory').value||'General',price:Number($('rPrice').value||0),image_url:$('rImage').value.trim()||null,ingredients:$('rIngredients').value,instructions:$('rInstructions').value,created_by:user.id});if(error)return msg(error.message);['rTitle','rCategory','rPrice','rImage','rIngredients','rInstructions'].forEach(id=>$(id).value='');msg('Recipe saved');await loadRecipes()};
$('saveItem').onclick=async()=>{if(!$('iName').value.trim())return msg('Item name required');const {error}=await db.from('ration_items').insert({name:$('iName').value.trim(),unit:$('iUnit').value||'kg',quantity:Number($('iQty').value||0),reorder_level:Number($('iReorder').value||0)});if(error)return msg(error.message);$('iName').value='';msg('Stock item added');await loadStock()};
$('savePurchase').onclick=async()=>{const id=$('pItem').value,qty=Number($('pQty').value),price=Number($('pPrice').value);if(!id||qty<=0||price<0)return msg('Item, positive quantity aur valid price bharein');const {error}=await db.from('ration_purchases').insert({item_id:id,purchase_date:$('pDate').value||new Date().toISOString().slice(0,10),quantity:qty,unit_price:price,supplier:$('pSupplier').value,notes:$('pNotes').value,created_by:user.id});if(error)return msg(error.message);const item=items.find(x=>x.id===id);const upd=await db.from('ration_items').update({quantity:Number(item.quantity)+qty,updated_at:new Date().toISOString()}).eq('id',id);if(upd.error)return msg('Purchase saved; stock update failed: '+upd.error.message);$('pQty').value='';$('pPrice').value='';$('pSupplier').value='';$('pNotes').value='';msg('Purchase saved and stock increased');await Promise.all([loadStock(),loadPurchases()])};
init();
</script></body></html>
